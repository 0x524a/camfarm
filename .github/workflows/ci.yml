name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Asserts the property that matters for distribution: the artifact builds and
  # its tests pass with cgo disabled entirely, so it runs in a scratch container
  # and in CI with no system packages.
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      # ffprobe is the external decoder the media tests cross-check against.
      # It is installed rather than skipped around: a test that quietly skips
      # when its oracle is missing is worse than no test.
      #
      # This does not compromise the cgo-free claim. ffprobe runs as a
      # subprocess; nothing links against it.
      - name: install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version | head -1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      # fail_ci_if_error is false on purpose: Codecov needs the repo activated
      # at codecov.io (a one-time manual step, not something this workflow can
      # do) before an upload succeeds. Until that happens, this step reports
      # its own failure without turning the whole job -- and the CLAUDE.md
      # "CI green" claim -- red over a reporting integration, not a build or
      # test failure.
      - name: upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false

  # The race detector requires cgo, which is why this is a separate job. That
  # requirement is a property of the detector as a build-time tool, not of the
  # shipped artifact -- the `build` job above is what proves the artifact is
  # cgo-free. Both matter: mid-test mutation of a running fleet is a core
  # feature, so racing is a real risk and -race is not box-ticking here.
  race:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # ffprobe is the external decoder the media tests cross-check against.
      # It is installed rather than skipped around: a test that quietly skips
      # when its oracle is missing is worse than no test.
      #
      # This does not compromise the cgo-free claim. ffprobe runs as a
      # subprocess; nothing links against it.
      - name: install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version | head -1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: test -race
        run: go test -race ./...

  # Gated on SONAR_TOKEN being set, not on a fixed "is sonar configured" flag:
  # until the SonarCloud project is imported and the secret is added, this job
  # is skipped rather than failing, so it cannot turn CI red over an
  # integration nobody has finished wiring up yet. sonar-project.properties at
  # the repo root holds the project/organization keys.
  sonar:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.repository == '0x524a/camfarm' && secrets.SONAR_TOKEN != '' }}
    steps:
      # SonarCloud's issue tracking (new code vs. pre-existing) and blame
      # attribution need real commit history, not the single-commit shallow
      # clone actions/checkout gives by default.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      # Same coverage report format as the build job's Codecov upload, fed to
      # Sonar's Go coverage importer via sonar.go.coverage.reportPaths in
      # sonar-project.properties.
      - name: test with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
