name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel a superseded run on the same PR ref, but never a run on main: every
# push to main should finish so its result stays attributable to its commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Asserts the property that matters for distribution: the artifact builds and
  # its tests pass with cgo disabled entirely, so it runs in a scratch container
  # and in CI with no system packages.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ffprobe is the external decoder the media tests cross-check against.
      # It is installed rather than skipped around: a test that quietly skips
      # when its oracle is missing is worse than no test.
      #
      # This does not compromise the cgo-free claim. ffprobe runs as a
      # subprocess; nothing links against it.
      - name: install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version | head -1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # go.mod/go.sum must already be what `go mod tidy` would produce, so a
      # forgotten tidy (or a stray indirect requirement) fails here instead of
      # surfacing in a downstream consumer's build.
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      # Shared with the sonar job so it does not re-run the whole suite (and
      # reinstall ffmpeg) just to regenerate the same report.
      - name: upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

      # fail_ci_if_error is false on purpose: the upload needs the repo
      # activated at codecov.io and the CODECOV_TOKEN secret set (one-time
      # manual steps, not something this workflow can do). If either is
      # missing, or the secret is unavailable to the run, this step reports
      # its own failure without turning the whole job -- and the CLAUDE.md
      # "CI green" claim -- red over a reporting integration, not a build or
      # test failure.
      - name: upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The race detector requires cgo, which is why this is a separate job. That
  # requirement is a property of the detector as a build-time tool, not of the
  # shipped artifact -- the `build` job above is what proves the artifact is
  # cgo-free. Both matter: mid-test mutation of a running fleet is a core
  # feature, so racing is a real risk and -race is not box-ticking here.
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ffprobe is the external decoder the media tests cross-check against.
      # It is installed rather than skipped around: a test that quietly skips
      # when its oracle is missing is worse than no test.
      #
      # This does not compromise the cgo-free claim. ffprobe runs as a
      # subprocess; nothing links against it.
      - name: install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version | head -1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: test -race
        run: go test -race ./...

  # Gated on SONAR_TOKEN being set, not on a fixed "is sonar configured" flag:
  # until the SonarCloud project is imported and the secret is added, every
  # step below no-ops rather than failing, so this job cannot turn CI red over
  # an integration nobody has finished wiring up yet.
  # sonar-project.properties at the repo root holds the project/organization
  # keys. The gate lives in each step's `if`, not the job's: the secrets
  # context is only valid inside a step's if/with/env, never a job-level if
  # -- putting it there fails workflow validation before any job runs at all.
  sonar:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    if: ${{ github.repository == '0x524a/camfarm' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # SonarCloud's issue tracking (new code vs. pre-existing) and blame
      # attribution need real commit history, not the single-commit shallow
      # clone actions/checkout gives by default.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          fetch-depth: 0

      # coverage.out comes from the build job's single test run (same format
      # as its Codecov upload), downloaded to the workspace root so
      # sonar.go.coverage.reportPaths=coverage.out in sonar-project.properties
      # resolves. Downloaded after checkout, which would otherwise clean it.
      - name: download coverage artifact
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: .

      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Static analysis with a deliberately small curated set; see .golangci.yml
  # for the enabled linters and each justified exclusion.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  # Known-vulnerability scan of the module's dependencies and the standard
  # library it builds against.
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Not go-version-file: go.mod says `go 1.26.0`, and setup-go treats
          # that as the exact patch release, so check-latest cannot move it
          # forward (the other jobs therefore build with 1.26.0). The standard
          # library is part of what govulncheck scans, so scan against the
          # newest stable toolchain, which is what a fresh build would use.
          go-version: stable
          check-latest: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  # Proves the cgo-free claim for every shipped target: with CGO_ENABLED=0 the
  # whole module must compile for each OS/arch pair, not just the linux/amd64
  # the other jobs run on. Compile-only; nothing is executed.
  cross-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go build (${{ matrix.goos }}/${{ matrix.goarch }})
        run: go build ./...
