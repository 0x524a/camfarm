<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="CamFarm icon: a two-by-two grid of camera lenses">
  <title>CamFarm</title>
  <defs>
    <g id="lens">
      <circle cx="39" cy="39" r="21" fill="#22384a" stroke="#4fb286" stroke-width="4"/>
      <circle cx="39" cy="39" r="11" fill="#0b141c" stroke="#7fd6ad" stroke-width="2.5"/>
      <circle cx="34.5" cy="34.5" r="3.2" fill="#e6f7ef"/>
    </g>
  </defs>
  <rect width="128" height="128" rx="26" fill="#14202b"/>
  <use href="#lens"/>
  <use href="#lens" x="50"/>
  <use href="#lens" y="50"/>
  <use href="#lens" x="50" y="50"/>
  <circle cx="113" cy="15" r="5" fill="#ef5b5b"/>
</svg>
