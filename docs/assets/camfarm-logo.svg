<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 144" width="460" height="144" role="img" aria-label="CamFarm: synthetic RTSP camera farm">
  <title>CamFarm</title>
  <defs>
    <g id="lens">
      <circle cx="39" cy="39" r="21" fill="#22384a" stroke="#4fb286" stroke-width="4"/>
      <circle cx="39" cy="39" r="11" fill="#0b141c" stroke="#7fd6ad" stroke-width="2.5"/>
      <circle cx="34.5" cy="34.5" r="3.2" fill="#e6f7ef"/>
    </g>
  </defs>
  <rect width="460" height="144" rx="28" fill="#14202b"/>
  <!-- the icon, scaled to 100px and centred vertically -->
  <g transform="translate(24 22) scale(0.78125)">
    <rect width="128" height="128" rx="26" fill="#0e1822"/>
    <use href="#lens"/>
    <use href="#lens" x="50"/>
    <use href="#lens" y="50"/>
    <use href="#lens" x="50" y="50"/>
    <circle cx="113" cy="15" r="5" fill="#ef5b5b"/>
  </g>
  <text x="148" y="82" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1"><tspan fill="#e6f7ef">Cam</tspan><tspan fill="#4fb286">Farm</tspan></text>
  <text x="151" y="112" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#8fa6b5" letter-spacing="0.4">Synthetic RTSP camera farm</text>
</svg>
